<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a121d">
<title>Football Auction</title>
<style>
/* ============================================================
   FOOTBALL AUCTION — estilos
   A cor de destaque (--g) é trocada pelo jogador (Configurações).
   ============================================================ */
:root{
  --bg:#0a121d;--bg2:#0e1a2a;--card:#13223a;--card2:#192c49;--ln:#243a5c;--ln2:#33507d;
  --tx:#eef3f8;--mu:#8da1bc;--g:#22c55e;--on:#06210f;--r:#ef4444;--y:#f5b942;--b:#4da3ff;
  --rad:16px;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--tx);background-color:var(--bg);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(900px 500px at 85% -5%,color-mix(in srgb,var(--g) 9%,transparent),transparent 65%),
                   radial-gradient(700px 400px at -5% 105%,rgba(77,163,255,.07),transparent 65%);
  background-attachment:fixed}
[hidden]{display:none!important}
#app{max-width:1180px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
.grow{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mu{color:var(--mu)}.xs{font-size:12px}.sm{font-size:13px}
.caps{text-transform:uppercase;letter-spacing:.09em;font-size:11px;font-weight:700;color:var(--mu)}
.num{font-variant-numeric:tabular-nums}
.ok{color:var(--g)}.bad{color:#ff7b7b}.warn{color:var(--y)}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}

/* ---------- botões e campos ---------- */
.btn{appearance:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;
  padding:10px 16px;font:inherit;font-weight:650;cursor:pointer;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s,background .15s,border-color .15s,opacity .15s}
.btn:hover:not(:disabled){background:var(--card2);border-color:var(--ln2)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.pri{background:var(--g);border-color:var(--g);color:var(--on);font-weight:800}
.btn.pri:hover:not(:disabled){background:color-mix(in srgb,var(--g) 86%,white);border-color:transparent}
.btn.dng{color:#ff9a9a;background:#2a1820;border-color:#5b2a33}
.btn.dng:hover:not(:disabled){background:#3a1f29}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.lg{min-height:58px;font-size:18px;border-radius:14px}
.ib{appearance:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--card);
  color:var(--tx);font-size:17px;cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--card2)}
.in{width:100%;min-height:44px;background:var(--bg2);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font:inherit}
.in:focus{border-color:var(--g);outline:none}
.in:disabled{opacity:.4}
input[type=range]{width:100%;accent-color:var(--g)}
kbd{font:600 11px/1 ui-monospace,Menlo,monospace;background:var(--bg2);border:1px solid var(--ln);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--mu)}
@media(hover:none){kbd.k{display:none}}

/* ---------- cartões, chips, barras ---------- */
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--rad);padding:16px;margin-bottom:14px}
.card>h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg2);
  border:1px solid var(--ln);font-size:12px;font-weight:600;color:var(--mu);white-space:nowrap}
.chip.ok{color:var(--g);border-color:color-mix(in srgb,var(--g) 45%,transparent);background:color-mix(in srgb,var(--g) 11%,transparent)}
.chip.bad{color:#ff9a9a;border-color:#6b2c35;background:#2a1820}
.chip.warn{color:var(--y);border-color:#6b5420;background:#2a2314}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--g);transition:width .3s}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--ln);font-size:12px;font-weight:600;margin-right:4px}
.tag.pri{background:color-mix(in srgb,var(--g) 16%,transparent);border-color:color-mix(in srgb,var(--g) 50%,transparent);color:var(--g)}

/* ---------- topo ---------- */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;font-size:15px}
.brand svg{width:30px;height:30px;color:var(--g)}
.top2{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top2 h2{font-size:22px;font-weight:850;letter-spacing:-.01em}

/* ---------- menu ---------- */
.hero{position:relative;max-width:520px;margin:4vh auto 0;text-align:center;display:grid;gap:14px;justify-items:stretch}
.hero::before{content:"";position:absolute;left:50%;top:-30px;width:560px;height:560px;margin-left:-280px;border:2px solid rgba(255,255,255,.04);border-radius:50%;pointer-events:none}
.hero::after{content:"";position:absolute;left:-40%;right:-40%;top:250px;border-top:2px solid rgba(255,255,255,.04);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .logo{width:84px;height:84px;margin:0 auto;color:var(--g);filter:drop-shadow(0 6px 20px color-mix(in srgb,var(--g) 35%,transparent))}
.hero h1{font-size:clamp(42px,12vw,70px);line-height:.92;font-weight:950;letter-spacing:-.025em;text-transform:uppercase}
.hero h1 span{color:var(--g)}
.hero .tagline{color:var(--mu);font-size:16px;max-width:400px;margin:0 auto}
.cont{flex-direction:column;gap:2px;align-items:center;min-height:64px}
.cont small{font-weight:500;color:var(--mu);font-size:12px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fine{font-size:12px;color:var(--mu)}

/* ---------- configuração ---------- */
.setup{display:grid;gap:14px;align-items:start}
@media(min-width:860px){.setup{grid-template-columns:1fr 330px}.setup .side{position:sticky;top:14px}}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field>label,.lab{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px;margin-bottom:8px}
.lab small{font-weight:500;color:var(--mu);font-size:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:58px;padding:8px 10px}
.seg .btn.on{background:var(--g);border-color:var(--g);color:var(--on);font-weight:800}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.opt{text-align:left;flex-direction:column;align-items:flex-start;gap:4px;height:100%;padding:12px}
.opt b{font-size:15px}.opt small{font-weight:500;color:var(--mu);font-size:12px;line-height:1.3}
.opt.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--card))}
.mf{display:flex;flex-direction:column-reverse;gap:3px;margin-bottom:4px;align-items:center;width:100%;height:50px;justify-content:flex-start}
.mf div{display:flex;gap:4px;justify-content:center}
.mf i{width:7px;height:7px;border-radius:50%;background:var(--ln2)}
.opt.on .mf i{background:var(--g)}
.mf i.h{background:var(--y);box-shadow:0 0 0 2px color-mix(in srgb,var(--y) 30%,transparent)}
.opt .hb{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--y);text-transform:uppercase}
.hybnote{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid #6b5420;background:color-mix(in srgb,var(--y) 9%,var(--card));font-size:13px;line-height:1.45}
.hybnote b{color:var(--tx)}
.hybnote ul{margin:6px 0 8px 18px;padding:0}.hybnote li{margin:2px 0}
.hybnote .fn{font-weight:800;margin-top:8px}
.crests{display:flex;flex-wrap:wrap;gap:8px}
.crests .btn{width:46px;min-height:46px;padding:0;font-size:22px}
.crests .btn.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 16%,var(--card))}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{appearance:none;width:36px;height:36px;border-radius:50%;border:3px solid transparent;background:var(--c);cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.sw.on{border-color:#fff}
.pv{display:flex;gap:14px;align-items:center}
.bigcrest{width:72px;height:72px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:36px;
  background:color-mix(in srgb,var(--g) 16%,var(--bg2));border:3px solid var(--g)}
.pv b{font-size:20px;word-break:break-word}

/* ---------- como jogar ---------- */
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--g) 15%,var(--bg2));border:1px solid color-mix(in srgb,var(--g) 40%,transparent)}
.step b{display:block;margin-bottom:2px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:14px}

/* ---------- arena ---------- */
.arena{display:grid;gap:14px;align-items:start}
@media(min-width:760px){.arena{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.stage{position:relative;overflow:hidden;--tier:#cd8b52;border-color:color-mix(in srgb,var(--tier) 40%,var(--ln))}
.stage::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--tier)}
.stage.enter{animation:slide .4s ease-out}
.t-gold{--tier:#f5c542}.t-silver{--tier:#c3d0e2}.t-bronze{--tier:#cd8b52}
.ph{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:16px}
.ovr{display:flex;flex-direction:column;align-items:center;min-width:62px;line-height:1}
.ovr b{font-size:48px;font-weight:950;color:var(--tier);letter-spacing:-.03em}
.ovr .pos{font-size:12px;font-weight:800;letter-spacing:.08em;margin-top:4px}
.ovr .fl{font-size:22px;margin-top:6px}
.pi h2{font-size:clamp(20px,5vw,26px);font-weight:850;line-height:1.1;margin-bottom:6px}
.av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:20px;letter-spacing:.02em;
  background:linear-gradient(145deg,hsl(var(--h) 55% 40%),hsl(var(--h) 55% 22%));border:3px solid var(--tier,var(--ln2))}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.at{--c:var(--g)}.at.mid{--c:var(--y)}.at.lo{--c:#ef6b6b}
.at .t{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:3px}
.at .t b{color:var(--tx);font-size:14px}
.at .bar{height:6px}.at .bar>i{background:var(--c)}

.live{position:relative;overflow:hidden}
.clockrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.clock{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--y)}.clock.crit{color:#ff6b6b;animation:blink .7s infinite}
.tbar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-bottom:14px}
.tbar>i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .12s linear}
.tbar.warn>i{background:var(--y)}.tbar.crit>i{background:#ff5d5d}
.pricebox{text-align:center;padding:14px 8px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--ln);margin-bottom:12px}
.price{font-size:clamp(36px,9vw,54px);font-weight:950;color:var(--g);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:inline-block}
.price.pop{animation:pop .4s ease}
.leadchip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:99px;margin-top:10px;font-weight:700;font-size:14px;
  background:color-mix(in srgb,var(--pc) 16%,transparent);border:1px solid color-mix(in srgb,var(--pc) 55%,transparent)}
.leadchip .crest{width:26px;height:26px;font-size:14px;border-width:2px}
.facts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.next{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mu)}
.sale{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(3px);animation:fade .25s ease}
.stamp{font-size:clamp(28px,7vw,40px);font-weight:950;letter-spacing:.06em;padding:4px 18px;border:4px solid var(--pc,var(--mu));color:var(--pc,var(--mu));border-radius:10px;transform:rotate(-6deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
.sale .amt{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.sale .who{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800}

.actions{margin-bottom:14px}
.quick{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px;margin-bottom:8px}
.qb{flex-direction:column;gap:1px;padding:8px 6px;min-height:62px}
.qb b{font-size:17px;font-variant-numeric:tabular-nums}
.qb small{font-size:11px;font-weight:600;opacity:.75}
.custom{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.hint{min-height:20px;margin-top:8px;font-size:13px;font-weight:600}
.hint.bad{color:#ff7b7b;animation:shake .3s}.hint.warn{color:var(--y)}.hint.ok{color:var(--g)}
@media(min-width:760px){.actions{position:sticky;bottom:12px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.35)}}
@media(max-width:759px){
  body[data-scr=arena] #app{padding-bottom:calc(210px + env(safe-area-inset-bottom))}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;border-radius:18px 18px 0 0;border-width:1px 0 0;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 95%,transparent);
    backdrop-filter:blur(10px);box-shadow:0 -12px 30px rgba(0,0,0,.45)}
  .quick{margin-bottom:8px}.qb{min-height:56px}
  .custom .in,.custom .btn{min-height:42px}
}
@media(max-width:759px) and (orientation:landscape){
  .actions{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .qb{min-height:46px}.qb small{display:none}.hint{margin-top:4px;min-height:16px}
  body[data-scr=arena] #app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
}
/* telas baixas (celular deitado): barra de ações compacta numa linha só */
@media(max-height:520px){
  body[data-scr=arena] #app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;border-radius:14px 14px 0 0;border-width:1px 0 0;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 95%,transparent);
    backdrop-filter:blur(10px);box-shadow:0 -10px 24px rgba(0,0,0,.45)}
  #bidpane{display:flex;gap:8px;align-items:stretch}
  .quick{flex:1;margin:0}.qb{min-height:46px}.qb small{display:none}
  .custom{display:flex}.custom .in,.custom #bgo{display:none}.hint{display:none}
}
@media(max-width:759px){.attrs{grid-template-columns:repeat(3,1fr);gap:8px 12px}.ph{margin-bottom:12px}}
@media(max-width:560px){.brand span{display:none}}
@media(max-width:380px){.attrs{gap:8px 14px}.ph{gap:10px}.av{width:50px;height:50px;font-size:17px}.ovr b{font-size:40px}}

/* ---------- lateral: orçamento, rivais, campo, histórico ---------- */
.big{font-size:34px;font-weight:950;color:var(--g);line-height:1.05;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.needs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.crest{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:20px;
  background:color-mix(in srgb,var(--pc) 18%,var(--bg2));border:2px solid var(--pc)}
.rv{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.hdr+.rv{border-top:0;padding-top:0}
.rv-top{display:flex;gap:8px;align-items:baseline;margin-bottom:5px}
.rv .bar{height:6px}.rv .bar>i{background:var(--pc)}
.rv-sub{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ln2);margin-left:2px}
.dots i.on{background:var(--pc)}
.st{font-size:12px;font-weight:700;white-space:nowrap;color:var(--mu)}
.st.lead{color:var(--y)}.st.on{color:var(--g)}.st.out{color:#7d8ea6}
.st.think{color:var(--y)}
.st.think::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--y);margin-right:6px;animation:blink .9s infinite}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.hdr h3{margin:0!important}
.mini{display:flex;gap:4px}.mini .btn{min-height:30px;padding:3px 9px;font-size:12px;border-radius:9px}
.mini .btn.on{background:var(--g);color:var(--on);border-color:var(--g)}
.pitch{position:relative;border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:360px;
  background:repeating-linear-gradient(90deg,#0f3d25 0 38px,#114529 38px 76px);border:2px solid #1d7447;overflow:hidden}
.pitch::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.16)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border:2px solid rgba(255,255,255,.16);border-radius:50%}
.line{display:flex;justify-content:space-around;position:relative;z-index:1}
.slot{width:66px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.slot .pc{width:46px;height:46px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-weight:900;font-size:16px;
  background:#0a121de6;border:2px solid var(--tier,#fff);position:relative}
.slot .nm{font-size:11px;font-weight:700;margin-top:3px;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .pr{font-size:10px;color:#c7f0d8;text-shadow:0 1px 2px #000}
.slot.empty .pc{background:transparent;border:2px dashed rgba(255,255,255,.35);color:rgba(255,255,255,.65);font-size:12px;font-weight:800}
.slot.empty .nm{color:rgba(255,255,255,.55);font-weight:600}
.slot.want .pc{border-color:var(--g);border-style:solid;color:var(--g);box-shadow:0 0 0 4px color-mix(in srgb,var(--g) 30%,transparent);animation:pulse 1.2s infinite}
.slot.sel .pc{outline:3px solid var(--y);outline-offset:2px}
.slot.can .pc{box-shadow:0 0 0 3px rgba(245,185,66,.45)}
.slot .alt{position:absolute;right:-3px;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--y);color:#2a1f00;font:800 9px/14px system-ui;font-style:normal}
@media(max-width:420px){.slot{width:58px}.slot .pc{width:42px;height:42px;font-size:15px}}
.log{max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}
.lg{display:flex;gap:8px;font-size:13px;padding:6px 9px;border-radius:9px;background:var(--bg2);border-left:3px solid var(--pc,var(--ln2))}
.lg.sold{background:color-mix(in srgb,var(--pc,var(--g)) 12%,var(--bg2))}
.lg:first-child{animation:fade .3s}

/* ---------- final ---------- */
.headline{text-align:center;margin:6px 0 18px}
.headline h2{font-size:clamp(26px,7vw,40px);font-weight:950;letter-spacing:-.02em}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:18px}
.pod{text-align:center;padding:14px 6px;border-radius:16px;background:var(--card);border:1px solid var(--ln);--pc:var(--ln2)}
.pod .crest{margin:0 auto 8px;width:48px;height:48px;font-size:24px}
.pod b{display:block;font-size:14px;line-height:1.2;word-break:break-word}
.pod .sc{font-size:22px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
.pod .medal{font-size:26px}
.pod.p1{border-color:#f5c542;padding:22px 6px;background:color-mix(in srgb,#f5c542 8%,var(--card))}
.pod.me{box-shadow:0 0 0 2px var(--g)}
.res h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:20px;margin-bottom:4px}
.res .sc{margin-left:auto;color:var(--g);font-weight:950;font-size:26px}
.sec{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:5px 0}
.sec b{text-align:right;font-variant-numeric:tabular-nums}
.buys{display:grid;gap:6px;margin:10px 0;font-size:13px}
.resgrid{display:grid;gap:14px}
@media(min-width:860px){.resgrid{grid-template-columns:1fr 1fr}}
.hrow{padding:12px 0;border-top:1px solid var(--ln)}
.hrow:first-of-type{border-top:0}

/* ---------- sobreposições ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--ln2);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:slide .25s ease-out;max-width:92vw}
.toast.warn{border-color:#6b5420;color:var(--y)}.toast.bad{border-color:#6b2c35;color:#ff9a9a}
.mback,.pause{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(5,10,17,.72);backdrop-filter:blur(5px);animation:fade .2s}
.mbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--ln2);border-radius:18px;padding:22px;display:grid;gap:14px;animation:slide .25s ease-out}
.mbox h3{font-size:19px}
.mbox .row{justify-content:flex-end}
.pause{z-index:60;text-align:center}
.pause .box{display:grid;gap:14px;justify-items:center;max-width:340px}
.pause h2{font-size:36px;font-weight:950}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall 1.5s ease-in forwards}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.35}}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--g) 8%,transparent)}}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes stamp{from{opacity:0;transform:rotate(-6deg) scale(2.2)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot))}}
body.nomotion *,body.nomotion *::before,body.nomotion *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
button,.btn,.slot,.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@supports(height:100dvh){body{min-height:100dvh}}
@media(pointer:coarse){.actions .btn,.opt,.ib{min-height:44px}input,select,.in{font-size:16px}.slot{min-height:64px}}
</style>

<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="modal"></div>
<script src="database.js"></script>
<script>
'use strict';
/* ============================================================
   FOOTBALL AUCTION
   Seções: UTIL · DADOS · PREFERÊNCIAS · ENGINE · IA · AVALIAÇÃO ·
           PERSISTÊNCIA · EFEITOS · TELAS · LOOP
   ============================================================ */

/* ---------- UTIL ---------- */
const $=s=>document.querySelector(s);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>'M$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- DADOS (catálogo, escala 0-100) ---------- */
const POS=['GK','DEF','MID','ATT'],AT=['Velocidade','Finalização','Passe','Drible','Defesa','Físico'];
/* Pesos da nota geral por posição, na ordem dos atributos acima (cada linha soma ~1). */
const W={GK:[.1,0,.1,0,.6,.2],ZAG:[.1,.03,.1,.05,.5,.22],LD:[.25,.05,.2,.15,.25,.1],LE:[.25,.05,.2,.15,.25,.1],VOL:[.05,.05,.3,.15,.3,.15],MEI:[.1,.15,.35,.25,.1,.05],MAT:[.1,.25,.3,.3,0,.05],PD:[.25,.2,.1,.35,0,.1],PE:[.25,.2,.1,.35,0,.1],ATA:[.15,.45,.08,.2,0,.12]};
const FORM={
 '4-3-3':[['GK'],['LE','ZAG','ZAG','LD'],['VOL','MEI','MAT'],['PE','ATA','PD']],
 '4-4-2':[['GK'],['LE','ZAG','ZAG','LD'],['VOL','VOL','MEI','MAT'],['ATA','SA']],
 '4-2-3-1':[['GK'],['LE','ZAG','ZAG','LD'],['VOL','VOL'],['PE','MAT','PD'],['ATA']],
 '4-2-4':[['GK'],['LE','ZAG','ZAG','LD'],['VOL','VOL'],['PE','ATA','ATA','PD']],
 '3-5-2':[['GK'],['ZAG','ZAG','ZAG'],['AE','VOL','MEI','MAT','AD'],['ATA','SA']],
 '3-4-3':[['GK'],['ZAG','ZAG','ZAG'],['AE','VOL','MEI','AD'],['PE','ATA','PD']],
 '3-4-2-1':[['GK'],['ZAG','ZAG','ZAG'],['AE','VOL','VOL','AD'],['MAT','MAT'],['ATA']],
 '5-3-2':[['GK'],['LE','ZAG','ZAG','ZAG','LD'],['VOL','MEI','MAT'],['ATA','SA']]};
/* Posição secundária: o jogador rende 95% da nota geral quando joga na posição secundária. */
const SECW=.95;
/* Funções híbridas (ala e segundo atacante): aceitam posições de origem diferentes, cada uma com seu peso
   (fração da nota geral do jogador). Se a compatibilidade vem da posição SECUNDÁRIA do jogador, o peso é
   multiplicado por 95%. Jogador que não está na tabela não pode atuar na função. */
const HYB={
 AE:{LE:.97,PE:.90},
 AD:{LD:.97,PD:.90},
 SA:{ATA:.97,MAT:.95,PE:.90,PD:.90}};
const HYBN={AE:'Ala esquerda',AD:'Ala direita',SA:'Segundo atacante'};
const SECT={GK:['GK'],DEF:['ZAG','LD','LE'],MID:['VOL','MEI','MAT','AE','AD'],ATT:['PD','PE','ATA','SA']};
const SECN={GK:'Goleiro',DEF:'Defesa',MID:'Meio-campo',ATT:'Ataque'};
const POSN={GK:'Goleiro',ZAG:'Zagueiro',LD:'Lateral dir.',LE:'Lateral esq.',VOL:'Volante',MEI:'Meia',MAT:'Meia-atacante',PD:'Ponta dir.',PE:'Ponta esq.',ATA:'Atacante',AE:'Ala esq.',AD:'Ala dir.',SA:'Segundo atacante'};
const POSS={GK:'GOL',ZAG:'ZAG',LD:'LD',LE:'LE',VOL:'VOL',MEI:'MEI',MAT:'MAT',PD:'PD',PE:'PE',ATA:'ATA',AE:'AE',AD:'AD',SA:'SA'};
const tagFlag=s=>String.fromCodePoint(0x1F3F4,...[...s].map(c=>0xE0000+c.charCodeAt(0)),0xE007F);
const fl=n=>n==='Inglaterra'?tagFlag('gbeng'):n==='Escócia'?tagFlag('gbsct'):ISO[n]?String.fromCodePoint(...[...ISO[n]].map(c=>127397+c.charCodeAt(0))):'🏳️';
function gen(){return RAW.map((l,i)=>{const[n,nat,y,club,pos,sec,st]=l.split('|'),a=st.split(',').map(Number),ovr=Math.round(W[pos].reduce((s,w,k)=>s+w*a[k],0));
  return{id:'p'+i,name:n,nat,age:2026-y,club,pos,sec:sec||null,a,ovr,ref:Math.round(2*(Math.pow(Math.max(ovr-62,0)/10,2)*3+2))/2}})}
const tier=o=>o>=86?'gold':o>=82?'silver':'bronze';
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};
const ini=n=>{const w=n.replace(/[^\p{L} ]/gu,'').split(' ').filter(Boolean);return((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()};
const lastName=n=>n.split(' ').slice(-1)[0];
const av=(n,cls)=>`<div class="av ${cls||''}" style="--h:${hue(n)}">${ini(n)}</div>`;

/* Adversários: cada nome tem um brasão; a personalidade é sorteada a cada partida. */
const AIS=[['Dragões FC','🐉'],['Falcões','🦅'],['Tubarões','🦈'],['Lobos SC','🐺'],['Águias','⚡']];
const PERS=['Econômico','Agressivo','Tático','Equilibrado','Imprevisível'];
const PERS_INFO={'Econômico':'evita lances altos','Agressivo':'vai atrás dos craques','Tático':'só quer o que falta','Equilibrado':'gasta de forma uniforme','Imprevisível':'muda de humor'};
const AICOL=['#4da3ff','#f59e0b','#ec4899','#a78bfa','#14b8a6','#f97316','#22d3ee'];

/* ---------- PREFERÊNCIAS (lembradas entre partidas) ---------- */
const PK='footballAuction_prefs',SK='footballAuction_save',HK='footballAuction_hist';
const COLORS=[['#22c55e','Verde'],['#4da3ff','Azul'],['#f97316','Laranja'],['#a78bfa','Roxo'],['#ec4899','Rosa'],['#22d3ee','Ciano'],['#facc15','Dourado']];
const CRESTS=['⚽','🦁','🐉','🦅','🐺','🦈','🔥','⭐','👑','🛡️','🐆','🚀'];
const SPEEDS={fast:['Rápido',.55],normal:['Normal',1],slow:['Lento',1.7]};
const DIFFS={facil:['Fácil','Bots cometem erros e disputam com cautela.'],normal:['Normal','Consideram orçamento, posições e qualidade.'],dificil:['Difícil','Planejam compras e controlam o saldo.']};
const P=Object.assign({sound:true,speed:'normal',fast:true,motion:true,color:'#22c55e',crest:'⚽',name:'Você',opps:3,diff:'normal',form:'4-3-3',budget:185,inc:1,dur:15},lsGet(PK)||{});if(!FORM[P.form])P.form='4-3-3';
const savePrefs=()=>lsSet(PK,P);
function theme(){document.documentElement.style.setProperty('--g',P.color);document.body.classList.toggle('nomotion',!P.motion)}

/* ---------- ESTADO ---------- */
let G=null,scr='menu',sel=null,dirty=true;
const EV=[];                       // eventos do motor → interface (sons, animações)
const R={};                        // referências do DOM da arena
const part=id=>G.parts.find(x=>x.id===id);
const touch=()=>{dirty=true};

/* ---------- ENGINE (regras, sem UI) ---------- */
const left=pt=>pt.sl.filter(x=>x<0).length,full=pt=>left(pt)<=0,rem=pt=>pt.budget-pt.spent;
const maxAff=pt=>full(pt)?0:Math.floor((rem(pt)-(left(pt)-1)*G.cfg.inc+1e-9)/G.cfg.inc)*G.cfg.inc;
const startP=p=>Math.max(G.cfg.inc,Math.round(p/4/G.cfg.inc)*G.cfg.inc);
const nextMin=()=>G.cur.bid?G.cur.bid.amt+G.cfg.inc:startP(G.cur.p.ref);
const roles=()=>FORM[G.cfg.form].flat();
/* Fração da nota geral com que o jogador rende na função r (0 = não pode atuar). */
function fit(p,r){
  if(p.pos===r)return 1;
  if(p.sec===r)return SECW;
  const h=HYB[r];if(!h)return 0;
  return Math.max(h[p.pos]||0,(h[p.sec]||0)*SECW)}
const canFill=(p,r)=>fit(p,r)>0;
/* Melhor vaga livre para o jogador: a de maior encaixe (posição principal > secundária > híbrida). */
function freeSlot(pt,p){const R_=roles();let b=-1,bf=0;R_.forEach((r,k)=>{if(pt.sl[k]>=0)return;const f=fit(p,r);if(f>bf){bf=f;b=k}});return b}

function log(k,t,pid){G.hist.unshift({k,t,p:pid||null});G.hist.length=Math.min(G.hist.length,60)}

/* Dá um lance. Retorna '' se aceito, ou o motivo da recusa. */
function bid(id,amt){
  const c=G.cur,pt=part(id),inc=G.cfg.inc;
  if(G.phase!=='bid')return'O leilão não está recebendo lances.';
  if(full(pt))return'Elenco completo.';
  if(freeSlot(pt,c.p)<0)return'Sem vaga livre para '+POSN[c.p.pos]+' na formação.';
  if(c.passed.includes(id))return'Você já desistiu deste jogador.';
  if(c.bid&&c.bid.leader===id)return'Você já lidera este leilão.';
  if(!isFinite(amt))return'Digite um valor válido.';
  amt=+(Math.round(amt/inc)*inc).toFixed(4);
  if(!(amt>=nextMin()-1e-9))return'Lance mínimo: '+fmt(nextMin());
  if(amt>maxAff(pt)+1e-9)return'Saldo insuficiente (máx. '+fmt(maxAff(pt))+', reservando as vagas restantes).';
  c.bid={amt,leader:id};c.nb=(c.nb||0)+1;
  c.t=Math.max(c.t,Math.min(G.cfg.dur,6));
  log('bid',pt.name+' deu lance de '+fmt(amt),id);
  EV.push({k:'bid',id,amt});
  arm();touch();save();return''}

/* Fecha o leilão: o líder paga e leva o jogador (ou ninguém leva). */
function close(){
  const c=G.cur;
  if(c.bid&&freeSlot(part(c.bid.leader),c.p)<0){log('info','Sem vaga para '+c.p.name+'; lance cancelado');c.bid=null}
  if(c.bid){const pt=part(c.bid.leader),fs=freeSlot(pt,c.p);
    pt.squad.push({p:c.p,price:c.bid.amt});pt.sl[fs]=pt.squad.length-1;pt.spent+=c.bid.amt;
    log('sold',c.p.name+' vendido a '+pt.name+' por '+fmt(c.bid.amt),pt.id);
    c.res=pt.name+' contrata por '+fmt(c.bid.amt);c.sale={who:pt.id,price:c.bid.amt};
    EV.push({k:'sold',who:pt.id,price:c.bid.amt})}
  else{log('unsold',c.p.name+' não vendido');c.res='Não vendido';c.sale=null;EV.push({k:'unsold'})}
  G.phase='sold';c.pause=3.4;c.q={};touch();save()}

function next(){
  if(!G||G.done||G.phase!=='sold'&&G.idx>=0&&G.phase!=='idle')return;
  G.idx++;sel=null;
  if(G.idx>=G.queue.length||G.parts.every(full))return finish();
  G.cur={p:G.queue[G.idx],bid:null,t:G.cfg.dur,passed:[],bias:{},q:{},nb:0,sale:null};
  G.phase='bid';arm(true);touch();save()}

/* Quem ainda pode dar lance neste leilão. */
function elig(){const c=G.cur;return G.parts.filter(pt=>!full(pt)&&freeSlot(pt,c.p)>=0&&!c.passed.includes(pt.id)&&(!c.bid||c.bid.leader!==pt.id)&&maxAff(pt)>=nextMin()-1e-9)}

/* ---------- IA (regras + personalidade; sem trapacear) ---------- */
/* Os bots NÃO agem na hora: cada um recebe um tempo de reação (c.q) que só começa
   a contar depois do último lance. Só UM bot age por vez, então dá para acompanhar. */
function reactDelay(a,first){
  const base=1100*SPEEDS[P.speed][1]*({'Agressivo':.75,'Econômico':1.15}[a.pers]||1);
  return base*(.7+Math.random()*.7)*(first?1.3:1)}
function arm(first){const c=G.cur;c.q={};elig().filter(a=>a.ai).forEach(a=>c.q[a.id]=reactDelay(a,first))}
function nextActor(){const c=G.cur;if(!c||G.phase!=='bid'||!c.q)return null;let b=null;for(const id in c.q)if(b===null||c.q[id]<c.q[b])b=id;return b}

function maxPay(a,p){const c=G.cur,d=G.cfg.diff,b=c.bias[a.id]=c.bias[a.id]||(a.pers==='Imprevisível'?.6+Math.random()*.8:.88+Math.random()*.24);
  const fsx=freeSlot(a,p),ft=fsx>=0?fit(p,roles()[fsx]):0,need=ft>=1?1.15:.85+.3*Math.min(1,Math.max(0,(ft-.9)/.1));
  let m={'Econômico':.85,'Agressivo':1.3,'Tático':need>=1?1.15:.6,'Equilibrado':1,'Imprevisível':1}[a.pers]*b;
  m*=d==='facil'?(.7+Math.random()*.4):d==='dificil'?(p.ovr>=80?1.1:.92):1;
  let v=p.ref*m*(a.pers==='Tático'?1:need);const avg=rem(a)/left(a);if(d==='dificil')v=Math.min(v,avg*3);
  return Math.min(v,maxAff(a))}

/* Chamada quando o tempo de reação de um bot acaba: dá lance, desiste ou hesita. */
function aiAct(a){
  const c=G.cur,inc=G.cfg.inc;delete c.q[a.id];
  if(full(a)||c.passed.includes(a.id)||(c.bid&&c.bid.leader===a.id))return;
  const lim=maxPay(a,c.p),min=nextMin();
  if(min>lim+1e-9||maxAff(a)<min-1e-9){c.passed.push(a.id);log('pass',a.name+' desistiu',a.id);EV.push({k:'pass',id:a.id});touch();return}
  if(Math.random()<(a.pers==='Agressivo'?.08:.18)){c.q[a.id]=reactDelay(a)*1.2;return}   // hesita uma rodada
  let amt=min;
  if(c.bid&&Math.random()<(a.pers==='Agressivo'?.3:.15)&&min+inc<=lim+1e-9)amt=min+inc;  // às vezes sobe 2 incrementos
  if(bid(a.id,amt)){c.passed.push(a.id);log('pass',a.name+' desistiu',a.id);touch()}
}

/* Por que o usuário não pode dar lance agora? ('' = pode; 'lead'/'phase' = sem mensagem de erro) */
function userBlock(){
  const c=G.cur,u=G.parts[0];
  if(G.phase!=='bid')return'phase';
  if(c.passed.includes('u'))return'Você desistiu deste jogador.';
  if(full(u))return'Seu elenco está completo.';
  if(freeSlot(u,c.p)<0)return'Você não tem vaga livre para '+POSN[c.p.pos]+'.';
  if(c.bid&&c.bid.leader==='u')return'lead';
  if(maxAff(u)<nextMin()-1e-9)return'Saldo insuficiente para cobrir o lance atual.';
  return''}

/* Avança o jogo em `ms` milissegundos (usado pelo loop e pelos testes). */
function step(ms){
  if(!G||G.done||scr!=='arena'||G.paused||!G.cur)return;
  const c=G.cur,b=userBlock();
  const out=G.phase==='bid'&&b!==''&&b!=='lead'&&b!=='phase';
  const dt=ms*(P.fast&&out?2.2:1);                    // acelera quando você já está fora do leilão
  if(G.phase==='sold'){if(c.pause==null)c.pause=3.4;c.pause-=dt/1000;if(c.pause<=0)next();return}
  if(G.phase!=='bid')return;
  c.t-=dt/1000;
  let rdy=null;
  for(const id in c.q){c.q[id]-=dt;if(c.q[id]<=0&&(rdy===null||c.q[id]<c.q[rdy]))rdy=id}
  if(rdy!==null)aiAct(part(rdy));
  if(G.phase==='bid'){
    if(!elig().length)c.t=c.bid?Math.min(c.t,.8):0;
    if(c.t<=0)close()}}

/* ---------- AVALIAÇÃO ---------- */
/* Nota efetiva = nota geral × encaixe da função (100% na principal, 95% na secundária, tabela HYB nas híbridas). */
function effOvr(p,r){return Math.round(p.ovr*fit(p,r))}
function score(pt){const R_=roles(),sec={},ef=R_.map((r,i)=>{const s=pt.squad[pt.sl[i]];return s?effOvr(s.p,r):40});
  for(const k in SECT){const v=ef.filter((e,i)=>SECT[k].includes(R_[i]));sec[k]=v.reduce((a,b)=>a+b,0)/v.length}
  const avg=ef.reduce((a,b)=>a+b,0)/ef.length,vs=Object.values(sec),bal=100-(Math.max(...vs)-Math.min(...vs));
  return{avg,sec,bal,sc:avg*.85+bal*.15,cb:(avg-50)/Math.max(pt.spent,1)*10}}

/* ---------- PERSISTÊNCIA ---------- */
function save(){if(G)lsSet(SK,G)}
function load(){
  let raw=null;try{raw=localStorage.getItem(SK)}catch(e){}
  if(!raw)return toast('Nenhuma partida salva.','warn');
  try{const g=JSON.parse(raw);
    if(!g.cfg||!g.parts||!g.queue||g.parts.some(p=>!Array.isArray(p.squad)||!Array.isArray(p.sl)))throw 0;
    if(!FORM[g.cfg.form])return toast('Esta partida usa uma formação que foi removida ('+g.cfg.form+'). O save NÃO foi apagado.','bad');
    const RF=FORM[g.cfg.form].flat();
    if(g.parts.some(p=>p.sl.some((q,i)=>q>=0&&!(p.squad[q]&&canFill(p.squad[q].p,RF[i])))))return toast('Este save usa regras de posição antigas e não pode ser aberto. Ele NÃO foi apagado.','bad');
    G=g;G.paused=!G.done;sel=null;
    if(G.cur&&!G.cur.q){G.cur.q={};if(G.phase==='bid')arm()}
    go(G.done?'final':'arena')}
  catch(e){toast('Save corrompido ou incompleto. Ele NÃO foi apagado.','bad')}}
function wipe(){ask('Apagar a partida salva?','Isso não pode ser desfeito.','Apagar',()=>{try{localStorage.removeItem(SK)}catch(e){}G=null;render();toast('Partida salva apagada.')},true)}
function finish(){
  G.done=true;G.phase='end';

let AC=null;
function beep(f,d,type,vol,when){
  if(!P.sound)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(when||0);
    o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={bid:()=>beep(560,.09,'triangle',.06),rival:()=>beep(380,.1,'sine',.06),pass:()=>beep(250,.08,'sine',.035),
  tick:()=>beep(900,.05,'square',.02),err:()=>beep(160,.12,'square',.03),
  sold:()=>{beep(520,.12,'sine',.06);beep(660,.12,'sine',.06,.1);beep(880,.22,'sine',.06,.2)},unsold:()=>beep(200,.25,'sawtooth',.03)};
function confetti(){
  if(!P.motion)return;const box=document.createElement('div');box.className='confetti';
  for(let i=0;i<30;i++){const s=document.createElement('i');
    s.style.cssText=`left:${Math.random()*100}%;background:${rnd(['#22c55e','#f5b942','#4da3ff','#ec4899','#ffffff'])};animation-delay:${Math.random()*.3}s;--dx:${(Math.random()*2-1)*120}px;--rot:${Math.random()*720}deg`;box.appendChild(s)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2000)}

/* Monta a fila garantindo jogadores suficientes para cada posição da formação. */
function buildQueue(pool,c,r){
  const teams=c.opps+1,total=teams*c.slots+6,need={};
  roles0(c.form).forEach(x=>need[x]=(need[x]||0)+teams);
  const sh=shuffle(pool,r),pick=[],used=new Set();
  for(const pos in need)sh.filter(p=>p.pos===pos).slice(0,need[pos]+2).forEach(p=>{pick.push(p);used.add(p.id)});
  for(const p of sh){if(pick.length>=total)break;if(!used.has(p.id)){pick.push(p);used.add(p.id)}}
  return shuffle(pick,r)}
const roles0=f=>FORM[f].flat().map(r=>r==='AE'?'LE':r==='AD'?'LD':r==='SA'?'ATA':r);

function startGame(){
  const c={name:(P.name||'').trim().slice(0,16)||'Você',opps:cl(P.opps,1,3),diff:P.diff,budget:cl(P.budget,100,220),inc:P.inc,dur:cl(P.dur,8,30),slots:11,form:P.form,crest:P.crest,color:P.color};
  if(lsGet(SK))ask('Substituir a partida salva?','Já existe uma partida salva. Começar uma nova apaga a anterior.','Começar nova',()=>begin(c),true);
  else begin(c)}
function begin(c){
  const r=rng(Date.now()%1e9),q=buildQueue(gen(),c,r),cols=AICOL.filter(x=>x!==c.color);
  const parts=[{id:'u',name:c.name,ai:0,crest:c.crest,col:c.color,budget:c.budget,spent:0,squad:[],sl:Array(11).fill(-1)}];
  const per=shuffle(PERS,r),ais=shuffle(AIS,r);
  for(let i=0;i<c.opps;i++)parts.push({id:'a'+i,name:ais[i][0],ai:1,crest:ais[i][1],col:cols[i%cols.length],pers:per[i],budget:c.budget,spent:0,squad:[],sl:Array(11).fill(-1)});
  G={cfg:c,parts,queue:q,idx:-1,hist:[],phase:'idle',cur:null,done:false,paused:false};
  sel=null;EV.length=0;scr='arena';next();if(G.cur)render()}

   <div class="price" id="price">${fmt(c.bid?c.bid.amt:startP(p.ref))}</div><br>
   ${ld?`<span class="leadchip" style="--pc:${ld.col}"><span class="crest" style="--pc:${ld.col}">${ld.crest}</span>${esc(ld.name)}${ld.id==='u'?' (você)':''}</span>`:'<span class="mu sm">Aguardando o primeiro lance…</span>'}</div>
  <div class="facts">${cmp}${slot}<span class="chip">Próximo mínimo ${fmt(nextMin())}</span>${c.nb?`<span class="chip">${c.nb} lance${c.nb>1?'s':''}</span>`:''}</div>
  ${up.length?`<div class="next"><span class="caps">A seguir</span>${up.map(x=>`<span class="chip">${POSS[x.pos]} ${x.ovr}</span>`).join('')}</div>`:''}`}

function saleHTML(){
  const c=G.cur,s=c.sale;
  if(G.phase!=='sold')return'';
  if(s===undefined)return`<div class="sale"><div class="stamp">${esc(c.res||'')}</div></div>`;
  if(!s)return`<div class="sale" style="--pc:#8da1bc"><div class="stamp">SEM COMPRADOR</div><div class="mu">Ninguém deu lance por ${esc(c.p.name)}.</div></div>`;
  const w=part(s.who),d=Math.round((s.price/c.p.ref-1)*100);
  return`<div class="sale" style="--pc:${w.col}"><div class="stamp">VENDIDO</div>
   <div class="who"><span class="crest" style="--pc:${w.col}">${w.crest}</span>${esc(w.name)}${w.id==='u'?' (você)':''}</div>
   <div class="amt">${fmt(s.price)}</div><div class="mu xs">${d<=0?Math.abs(d)+'% abaixo':d+'% acima'} da referência (${fmt(c.p.ref)})</div></div>`}

function needList(u){const n={};roles().forEach((r,i)=>{if(u.sl[i]<0)n[r]=(n[r]||0)+1});return Object.entries(n)}
function status(a){
  const c=G.cur;if(G.phase!=='bid')return c.sale&&c.sale.who===a.id?['🏆 levou','lead']:['',''];
  if(c.bid&&c.bid.leader===a.id)return['👑 líder','lead'];
  if(c.passed.includes(a.id))return['saiu','out'];
  if(full(a))return['completo','out'];
  if(freeSlot(a,c.p)<0)return['sem vaga','out'];
  if(maxAff(a)<nextMin()-1e-9)return['sem verba','out'];
  return R.na===a.id?['pensando','think']:['na disputa','on']}
const dots=a=>Array.from({length:G.cfg.slots},(_,i)=>`<i class="${i<a.squad.length?'on':''}"></i>`).join('');
function histRow(h){
  if(typeof h==='string')return`<div class="lg">${esc(h)}</div>`;
  const ic={bid:'🔨',pass:'🚪',sold:'✅',unsold:'❌',info:'⚠️'}[h.k]||'•',p=h.p?part(h.p):null;
  return`<div class="lg ${h.k}" ${p?`style="--pc:${p.col}"`:''}><span>${ic}</span><span>${esc(h.t)}</span></div>`}

function sideHTML(){
  const u=G.parts[0],pct=u.spent/u.budget*100,nd=needList(u);
  return`<section class="card"><h3>Seu orçamento</h3>
   <div class="big">${fmt(rem(u))}</div><div class="bar" style="margin-top:10px"><i style="width:${pct}%"></i></div>
   <div class="stats"><div class="stat"><span class="mu xs">Gasto</span><b>${fmt(u.spent)}</b></div><div class="stat"><span class="mu xs">Vagas</span><b>${left(u)} de ${G.cfg.slots}</b></div><div class="stat"><span class="mu xs">Lance máx.</span><b>${fmt(maxAff(u))}</b></div></div>
   ${nd.length?`<div class="needs"><span class="caps" style="align-self:center">Faltam</span>${nd.map(([r,n])=>`<span class="chip">${n>1?n+'× ':''}${POSN[r]}</span>`).join('')}</div>`:''}</section>
  <section class="card"><div class="hdr"><h3>Adversários</h3><div class="mini">${Object.entries(SPEEDS).map(([k,v])=>`<button class="btn${P.speed===k?' on':''}" onclick="setSpeed('${k}')" title="Ritmo dos adversários">${v[0]}</button>`).join('')}</div></div>
   ${G.parts.slice(1).map(a=>{const s=status(a);return`<div class="rv" style="--pc:${a.col}"><div class="crest">${a.crest}</div>
    <div><div class="rv-top"><b>${esc(a.name)}</b><span class="mu xs">${a.pers}</span></div><div class="bar"><i style="width:${rem(a)/a.budget*100}%"></i></div>
    <div class="rv-sub xs mu"><span class="num">${fmt(rem(a))}</span><span class="dots">${dots(a)}</span></div></div><span class="st ${s[1]}">${s[0]}</span></div>`}).join('')}</section>
  <section class="card"><h3>Seu elenco · ${G.cfg.form}</h3>${pitch(u,true)}<p class="mu xs" style="margin-top:10px">Toque num jogador e depois noutra posição para movê-lo ou trocar. Fora da posição principal o jogador perde parte da nota (secundária: 95%; funções híbridas: ver regras). A bolinha já mostra a nota efetiva.</p></section>
  <section class="card"><h3>Lances e contratações</h3><div class="log">${G.hist.map(histRow).join('')||'<span class="mu sm">Sem lances ainda.</span>'}</div></section>`}

function pitch(pt,ed){
  let k=0;const R_=roles(),rows=FORM[G.cfg.form].map(row=>row.map(r=>({r,i:k++})));
  const want=(ed&&G.phase==='bid'&&G.cur&&!full(pt))?freeSlot(pt,G.cur.p):-1,A=ed&&sel!==null?pt.squad[pt.sl[sel]]:null;
  return`<div class="pitch">${rows.slice().reverse().map(row=>`<div class="line">${row.map(({r,i})=>{
    const s=pt.squad[pt.sl[i]],can=A&&i!==sel&&canFill(A.p,r)&&(!s||canFill(s.p,R_[sel]));
    const cls=['slot',s?'':'empty',ed&&sel===i?'sel':'',can?'can':'',want===i?'want':''].join(' ');
    return`<div class="${cls}" ${ed?`onclick="pick(${i})"`:''} title="${s?esc(s.p.name)+' · '+effOvr(s.p,r)+(fit(s.p,r)<1?' ('+pct(fit(s.p,r))+' de '+s.p.ovr+')':'')+' · '+fmt(s.price):POSN[r]}">
     <div class="pc ${s?'t-'+tier(effOvr(s.p,r)):''}">${s?effOvr(s.p,r):POSS[r]}</div>
     <div class="nm">${s?esc(lastName(s.p.name)):r==='SA'?'Seg. atac.':POSN[r]}</div><div class="pr">${s?fmt(s.price):'vago'}</div></div>`}).join('')}</div>`).join('')}</div>`}

function pick(i){
  const pt=G.parts[0],R_=roles(),A=sel;
  if(A===null){if(pt.sl[i]>=0)sel=i;return touch()}
  if(A===i){sel=null;return touch()}
  const a=pt.squad[pt.sl[A]],b=pt.squad[pt.sl[i]];
  if(!canFill(a.p,R_[i])||(b&&!canFill(b.p,R_[A]))){say('Esse jogador não pode atuar nessa posição.');sfx.err();sel=null;return touch()}
  [pt.sl[A],pt.sl[i]]=[pt.sl[i],pt.sl[A]];sel=null;save();touch()}

/* Ações do usuário */
function say(t,kind){if(innerHeight<=520)toast(t,'bad');msgTxt=t;msgKind=kind||'bad';msgUntil=Date.now()+2800;paintMsg();setTimeout(paintMsg,2900)}
function paintMsg(){
  const el=$('#msg');if(!el||!G||!G.cur)return;let t=msgTxt,k=msgKind;
  if(Date.now()>msgUntil){const b=userBlock();t=(b==='phase'||!b)?'':b==='lead'?'Você lidera este leilão. Aguarde os rivais.':b;k=b==='lead'?'ok':'warn'}
  el.textContent=t;el.className='hint '+k}
function ub(n){if(!G||G.phase!=='bid')return;const c=G.cur,base=c.bid?c.bid.amt:nextMin()-G.cfg.inc,e=bid('u',base+n*G.cfg.inc);if(e){say(e);sfx.err()}else $('#amt').value=''}
function ubc(){if(!G||G.phase!=='bid')return;const v=parseFloat($('#amt').value.replace(',','.')),e=bid('u',v);if(e){say(e);sfx.err()}else $('#amt').value=''}
function pass(){
  const c=G&&G.cur;if(!c||G.phase!=='bid'||c.passed.includes('u'))return;
  if(c.bid&&c.bid.leader==='u')return say('Você lidera este leilão, não pode passar.');
  c.passed.push('u');log('pass','Você desistiu',  'u');EV.push({k:'pass',id:'u'});touch();save()}
function setSpeed(k){P.speed=k;savePrefs();if(G&&G.phase==='bid')arm();touch()}
function togSound(){P.sound=!P.sound;savePrefs();touch();if(P.sound)sfx.bid()}
function setPause(v){if(!G||G.done)return;G.paused=v;const e=$('#pause');if(e){e.hidden=!v;$('#pausetxt').textContent='O cronômetro está parado.'}if(!v)save()}
function toMenu(){if(G&&!G.done)save();go('menu')}

/* Atualização da arena: eventos → sons/animações; HTML só quando algo mudou */
function upd(){
  if(scr!=='arena'||!G||!G.cur||!R.stage){EV.length=0;return}
  while(EV.length){const e=EV.shift();
    if(e.k==='bid'){e.id==='u'?sfx.bid():sfx.rival();popPrice=true}
    else if(e.k==='pass'){if(e.id!=='u')sfx.pass()}
    else if(e.k==='sold'){sfx.sold();if(e.who==='u')confetti()}
    else if(e.k==='unsold')sfx.unsold()}
  const na=nextActor();if(na!==R.na){R.na=na;dirty=true}
  if(dirty){dirty=false;paint()}
  clock()}
function paint(){
  const c=G.cur;
  if(R.idx!==G.idx){R.idx=G.idx;R.stage.innerHTML=stageHTML(c.p);R.stage.className='card stage t-'+tier(c.p.ovr);void R.stage.offsetWidth;if(P.motion)R.stage.classList.add('enter');msgUntil=0}
  $('#prog').textContent=`Jogador ${G.idx+1}/${G.queue.length}`;
  $('#bsnd').textContent=P.sound?'🔊':'🔇';$('#bal').textContent='💰 '+fmt(rem(G.parts[0]));
  R.body.innerHTML=liveHTML();R.sale.innerHTML=saleHTML();R.side.innerHTML=sideHTML();
  const sold=G.phase==='sold';$('#bidpane').hidden=sold;$('#nextpane').hidden=!sold;
  $('#phase').textContent=sold?'Leilão encerrado':'Tempo restante';
  const blk=userBlock(),inc=G.cfg.inc,base=c.bid?c.bid.amt:nextMin()-inc,mx=maxAff(G.parts[0]);
  [[1,'q1','Lance mínimo','1'],[5,'q5','+5 incrementos','2'],[10,'q10','+10 incrementos','3']].forEach(([n,id,lab,key])=>{
    const amt=+(base+n*inc).toFixed(4),el=$('#'+id);
    el.innerHTML=`<b>${fmt(amt)}</b><small>${lab} <kbd class="k">${key}</kbd></small>`;el.disabled=!!blk||amt>mx+1e-9});
  $('#amt').disabled=!!blk;$('#bgo').disabled=!!blk;$('#bpass').disabled=!!blk;
  if(popPrice&&P.motion){const pe=$('#price');if(pe)pe.classList.add('pop')}popPrice=false;
  paintMsg()}
function clock(){
  const c=G.cur;
  if(G.phase==='bid'){
    const s=Math.max(0,c.t),cls=s<=3?'crit':s<=6?'warn':'';
    R.clock.textContent=s.toFixed(1)+'s';R.clock.className='clock '+cls;R.tbar.className='tbar '+cls;
    R.tfill.style.width=Math.min(100,s/G.cfg.dur*100)+'%';
    const w=Math.ceil(s);if(w!==lastSec){lastSec=w;if(w<=3&&w>0&&!G.paused)sfx.tick()}}
  else if(G.phase==='sold'){R.clock.textContent='—';R.clock.className='clock';R.tfill.style.width='0%';R.nfill.style.width=Math.max(0,c.pause/3.4*100)+'%'}}

/* ----- Resultado final ----- */
function vFinal(){
  const r=G.parts.map(pt=>({pt,...score(pt)})).sort((a,b)=>b.sc-a.sc),me=r.findIndex(x=>x.pt.id==='u')+1;
  const medal=['🥇','🥈','🥉'],ord=r.length>=3?[1,0,2]:r.length===2?[1,0]:[0];
  return`<div class="topbar"><div class="brand">${BALL}<span>Football Auction</span></div><span class="grow"></span><button class="btn sm" onclick="go('menu')">Menu</button></div>
  <div class="headline"><div class="caps">Resultado final · ${G.cfg.form}</div><h2>${me===1?'🏆 Você venceu!':'Você ficou em '+me+'º lugar'}</h2></div>
  <div class="podium">${ord.map(i=>{const x=r[i];return`<div class="pod p${i+1}${x.pt.id==='u'?' me':''}" style="--pc:${x.pt.col}"><div class="medal">${medal[i]}</div><div class="crest">${x.pt.crest}</div><b>${esc(x.pt.name)}</b><div class="sc">${x.sc.toFixed(1)}</div></div>`}).join('')}</div>
  <div class="row" style="margin-bottom:16px"><button class="btn pri" style="flex:1" onclick="replay()">🔁 Jogar de novo</button><button class="btn" style="flex:1" onclick="go('setup')">Nova partida</button></div>
  <div class="resgrid">`+r.map((x,i)=>{
   const e=Object.entries(x.sec).sort((a,b)=>b[1]-a[1]),pt=x.pt;
   const buys=pt.squad.map(s=>({s,d:s.price/s.p.ref})).sort((a,b)=>a.d-b.d),best=buys[0],worst=buys[buys.length-1];
   return`<div class="card res" style="--pc:${pt.col}"><h2><span class="crest" style="width:34px;height:34px;font-size:17px">${pt.crest}</span>${i+1}º ${esc(pt.name)}${pt.id==='u'?' <span class="chip ok">você</span>':`<span class="chip">${pt.pers}</span>`}<span class="sc">${x.sc.toFixed(1)}</span></h2>
   <div class="mu sm">Gasto ${fmt(pt.spent)} de ${fmt(pt.budget)} · saldo ${fmt(rem(pt))} · ${pt.squad.length} jogadores</div>
   <div style="margin:12px 0">${POS.map(k=>`<div class="sec"><span class="mu">${SECN[k]}</span><div class="bar"><i style="width:${x.sec[k]}%"></i></div><b>${x.sec[k].toFixed(0)}</b></div>`).join('')}</div>
   <div><span class="tag">Média ${x.avg.toFixed(1)}</span><span class="tag">Equilíbrio ${x.bal.toFixed(0)}</span><span class="tag">Custo-benefício ${x.cb.toFixed(2)}</span></div>
   ${best?`<div class="buys"><span>👍 <b>Melhor compra:</b> ${esc(best.s.p.name)} por ${fmt(best.s.price)} <span class="mu">(ref. ${fmt(best.s.p.ref)})</span></span><span>💸 <b>Mais caro p/ o valor:</b> ${esc(worst.s.p.name)} por ${fmt(worst.s.price)} <span class="mu">(ref. ${fmt(worst.s.p.ref)})</span></span></div>`:''}
   <p class="mu sm" style="margin-bottom:12px">Setor mais forte: ${SECN[e[0][0]]} (${e[0][1].toFixed(0)}); mais fraco: ${SECN[e[3][0]]} (${e[3][1].toFixed(0)}). ${rem(pt)>pt.budget*.15?'Sobrou saldo sem uso, o que custou qualidade.':'Orçamento bem aproveitado.'} Nota = 85% qualidade na formação + 15% equilíbrio entre setores.</p>${pitch(pt,false)}</div>`}).join('')+`</div>`}
function replay(){const c=Object.assign({},G.cfg);ask('Jogar de novo?','Uma nova partida começa com as mesmas configurações e uma fila de jogadores diferente.','Jogar',()=>begin(c))}

/* ---------- ATALHOS E LOOP ---------- */
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if($('#modal').firstChild){if(e.key==='Escape')closeM();return}
  if(e.target.matches('input,textarea,select'))return;
  if(scr!=='arena'||!G||G.done)return;
  const k=e.key.toLowerCase(),onBtn=e.target.matches('button');
  if(k==='m'){togSound();return}
  if(k===' '||k==='enter'){if(onBtn)return;e.preventDefault();
    if(G.paused)setPause(false);else if(G.phase==='sold')next();else if(k===' ')setPause(true);return}
  if(G.paused)return;
  if(k==='1'||k==='b')ub(1);else if(k==='2')ub(5);else if(k==='3')ub(10);else if(k==='p')pass()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scr==='arena'&&G&&!G.done&&!G.paused)setPause(true)});
/* Celular: mantém a tela acesa durante o leilão e salva ao sair da página */
let WL=null;async function wake(){try{if('wakeLock' in navigator&&scr==='arena'&&G&&!G.done&&!document.hidden&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});setInterval(wake,15000);
addEventListener('pagehide',()=>{try{if(G&&!G.done)save()}catch(e){}});
let lastT=performance.now();
setInterval(()=>{const n=performance.now(),dt=Math.min(n-lastT,200);lastT=n;step(dt);upd()},80);
setInterval(()=>{if(scr==='arena'&&G&&!G.done&&!G.paused)save()},4000);
theme();render();
</script>
</body>
</html>
